<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ishaq Jadoon Traders</title>
  <link rel="stylesheet" href="styles/fonts.css">
  <script src="libs/tailwind.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#f59e0b',
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            display: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['Inter', 'ui-monospace', 'monospace'],
            poppins: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Complete offline & instant response optimization: disable all CSS animations, transitions, and transforms */
    *, *::before, *::after {
      transition-property: none !important;
      transition-duration: 0s !important;
      transition-delay: 0s !important;
      animation: none !important;
      animation-duration: 0s !important;
      animation-delay: 0s !important;
      animation-iteration-count: 1 !important;
    }

    *, body, html, input, button, select, textarea {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }
    h1, h2, h3, h4, h5, h6, .font-display, .font-outfit, .font-poppins {
      font-family: 'Inter', sans-serif !important;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
      font-family: 'Inter', sans-serif !important;
    }

    /* Ensure entire receipt and preview document uniformly uses Inter (same as Generated At text) */
    .receipt-80mm, .receipt-80mm *, #preview-paper, #preview-paper * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    }

    /* Custom App Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #cbd5e1;
    }

    /* Sidebar specific scrollbar */
    .sidebar-scroll::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .sidebar-scroll::-webkit-scrollbar-thumb {
      background: #334155;
    }
    .sidebar-scroll::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Print containers must NEVER be visible on screen */
    @media screen {
      #receipt-print,
      #db-print-container,
      #voucher-print,
      #report-print-container {
        display: none !important;
      }
    }
  </style>
  <link rel="stylesheet" href="styles/print.css" media="print">
  <script src="libs/lucide.min.js"></script>
</head>
<body class="bg-gray-50 text-slate-800 font-sans h-screen flex overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-48 bg-slate-900 text-slate-300 flex flex-col no-print shrink-0 shadow-xl z-30">
    <div class="flex-1 flex flex-col min-h-0 overflow-y-auto sidebar-scroll">
      <!-- Logo Area -->
      <div class="pt-4 pb-2.5 px-3 flex flex-col items-center justify-center border-b border-slate-800 gap-2 shrink-0">
        <div class="w-36 h-36 flex items-center justify-center overflow-hidden rounded-2xl bg-white/5 border border-slate-700/50 p-1">
          <img id="sidebar-logo" src="" alt="Ishaq Jadoon Traders Logo" class="w-full h-full hidden object-cover object-center rounded-xl">
          <div id="sidebar-logo-placeholder" class="text-slate-500 flex flex-col items-center">
              <i data-lucide="image" class="w-12 h-12 opacity-20"></i>
          </div>
        </div>
        <h1 id="sidebar-title" class="text-base font-bold text-white tracking-tight text-center px-1 leading-snug">Ishaq Jadoon Traders</h1>
      </div>
  
      <!-- Nav Links -->
      <nav class="flex-1 py-2.5 flex flex-col gap-1 px-2.5">
        <button onclick="app.navigate('proposal-form')" id="nav-proposal-form" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 text-left transition-colors font-medium">
          <span class="w-5 h-5 flex items-center justify-center shrink-0"><i data-lucide="shopping-cart" class="w-5 h-5"></i></span>
          <span class="truncate">New Sale</span>
        </button>
        <button onclick="app.navigate('proposals')" id="nav-proposals" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 text-left transition-colors font-medium">
          <span class="w-5 h-5 flex items-center justify-center shrink-0"><i data-lucide="history" class="w-5 h-5"></i></span>
          <span class="truncate">Sales History</span>
        </button>
        <button onclick="app.navigate('customers')" id="nav-customers" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 text-left transition-colors font-medium">
          <span class="w-5 h-5 flex items-center justify-center shrink-0"><i data-lucide="users" class="w-5 h-5"></i></span>
          <span class="truncate">Customers</span>
        </button>
        <button onclick="app.navigate('master-db')" id="nav-master-db" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 text-left transition-colors font-medium">
          <span class="w-5 h-5 flex items-center justify-center shrink-0"><i data-lucide="database" class="w-5 h-5"></i></span>
          <span class="truncate">Stock</span>
        </button>
        <button onclick="app.navigate('rate-list')" id="nav-rate-list" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 text-left transition-colors font-medium">
          <span class="w-5 h-5 flex items-center justify-center shrink-0"><i data-lucide="tags" class="w-5 h-5"></i></span>
          <span class="truncate">Rate List</span>
        </button>
        <button onclick="app.navigate('expenses')" id="nav-expenses" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 text-left transition-colors font-medium">
          <span class="w-5 h-5 flex items-center justify-center shrink-0"><i data-lucide="receipt" class="w-5 h-5"></i></span>
          <span class="truncate">Expenses</span>
        </button>
        <button onclick="app.navigate('reports')" id="nav-reports" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 text-left transition-colors font-medium">
          <span class="w-5 h-5 flex items-center justify-center shrink-0"><i data-lucide="bar-chart-3" class="w-5 h-5"></i></span>
          <span class="truncate">Reports</span>
        </button>
        <button onclick="app.navigate('companies')" id="nav-companies" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 text-left transition-colors font-medium">
          <span class="w-5 h-5 flex items-center justify-center shrink-0"><i data-lucide="book-open" class="w-5 h-5"></i></span>
          <span class="truncate">Purchases</span>
        </button>
        <button onclick="app.navigate('dashboard')" id="nav-dashboard" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 text-left transition-colors font-medium">
          <span class="w-5 h-5 flex items-center justify-center shrink-0"><i data-lucide="layout-dashboard" class="w-5 h-5"></i></span>
          <span class="truncate">Dashboard</span>
        </button>
        <button onclick="app.navigate('settings')" id="nav-settings" class="nav-btn flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 text-left transition-colors font-medium">
          <span class="w-5 h-5 flex items-center justify-center shrink-0"><i data-lucide="settings" class="w-5 h-5"></i></span>
          <span class="truncate">Settings</span>
        </button>
      </nav>
    </div>

    <!-- Bottom Sidebar Section (Credits & Contact) -->
    <div class="p-3.5 border-t border-slate-800/80 bg-slate-950/60 shrink-0 text-center select-none">
      <p class="text-sm font-bold text-slate-300 tracking-tight leading-tight">Software by <span class="text-amber-400 font-black">PrimeSoft</span></p>
      <p class="text-[13px] font-medium text-slate-400 mt-1.5">Contact: <span class="text-white font-semibold text-[13px] tracking-wide tabular-nums">0309-5369472</span></p>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 relative flex flex-col overflow-y-auto print-full-width">
    <div id="app-content" class="p-8 flex-1">
      <!-- Dynamic content injected here -->
    </div>
  </main>

  <!-- Custom Confirm Modal -->
  <div id="confirm-modal" onclick="if(event.target === this) app.hideConfirm()" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-[1000] no-print p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full overflow-hidden flex flex-col md:flex-row max-h-[92vh]" id="confirm-card">
      
      <!-- Left Column: Receipt / Document Preview (hidden by default, shown when previewHtml provided) -->
      <div id="confirm-preview-col" class="hidden flex-col bg-slate-100 border-r border-slate-200 p-4 w-full md:w-[420px] lg:w-[450px] shrink-0 min-h-0">
        <div class="flex items-center justify-between mb-2 text-slate-500 text-xs font-bold uppercase tracking-wider px-1 shrink-0">
          <span class="flex items-center gap-1.5"><i data-lucide="receipt" class="w-4 h-4 text-accent"></i> Receipt Preview</span>
          <span class="text-[10px] text-slate-400 font-semibold normal-case">Scrollable</span>
        </div>
        <div class="flex-1 overflow-y-auto overflow-x-hidden min-h-[320px] max-h-[76vh] flex justify-center items-start p-3 pb-8 bg-slate-200/60 rounded-2xl shadow-inner custom-scrollbar">
          <div id="confirm-preview-content" class="bg-white shadow-lg rounded-xl border border-slate-300/80 p-0 w-full max-w-[340px] shrink-0 mb-4">
            <!-- Receipt HTML injected here -->
          </div>
        </div>
      </div>

      <!-- Right Column: Confirmation Message & Controls -->
      <div id="confirm-main-col" class="p-6 flex-1 flex flex-col justify-between overflow-y-auto max-h-[90vh]">
        <div>
          <div class="flex items-center gap-4 mb-4">
            <div id="confirm-icon-bg" class="w-10 h-10 rounded-full flex items-center justify-center bg-red-100 text-red-600 shrink-0">
              <i data-lucide="alert-triangle" id="confirm-icon" class="w-5 h-5"></i>
            </div>
            <div>
              <h3 id="confirm-title" class="text-lg font-bold text-slate-800">Confirm</h3>
            </div>
          </div>
          <div id="confirm-message" class="text-slate-600 mb-4 text-sm">Are you sure?</div>
          <div id="prompt-container" class="mb-4 hidden relative">
            <input type="text" id="prompt-input" class="w-full border border-slate-300 rounded-lg p-2.5 pr-10 focus:ring-2 focus:ring-accent focus:border-accent" placeholder="Type here...">
            <button type="button" id="prompt-toggle-btn" onclick="app.togglePromptPasswordVisibility()" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1 hidden">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <div class="flex justify-end gap-3 pt-4 border-t border-slate-100 mt-2" id="confirm-buttons-row">
          <button id="confirm-cancel-btn" class="px-5 py-2.5 rounded-xl text-sm font-bold text-slate-700 bg-slate-100 hover:bg-slate-200 cursor-pointer">Cancel</button>
          <button id="confirm-alt-btn" class="px-5 py-2.5 rounded-xl text-sm font-bold text-white bg-slate-800 hover:bg-slate-900 flex items-center gap-2 hidden cursor-pointer">Save</button>
          <button id="confirm-ok-btn" class="px-5 py-2.5 rounded-xl text-sm font-bold text-white bg-red-600 hover:bg-red-700 flex items-center gap-2 cursor-pointer">Confirm</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Payment Modal -->
  <div id="payment-modal" onclick="if(event.target === this) app.hidePaymentModal()" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-[1100] no-print">
    <div class="bg-white rounded-2xl shadow-2xl p-0 max-w-md w-full mx-4 overflow-hidden" id="payment-card">
      <div class="bg-slate-900 py-4 px-6 text-white flex justify-between items-center">
        <div>
          <h3 id="payment-title" class="text-xl font-black tracking-tight">Receive Payment</h3>
          <p id="payment-subtitle" class="text-[10px] uppercase font-black text-slate-400 tracking-widest mt-1">Transaction Settlement</p>
        </div>
        <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center text-accent">
          <i data-lucide="wallet" class="w-6 h-6"></i>
        </div>
      </div>
      
      <div class="p-5 space-y-3">
        <div id="payment-info-box" class="bg-slate-50 border border-slate-100 rounded-xl p-4 space-y-2 hidden">
            <!-- Dynamic info showing Invoice #, Date etc -->
        </div>

        <div class="space-y-3">
          <div>
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1.5 ml-1">Total Amount</label>
            <div id="payment-total-display" class="bg-slate-100/50 p-3 rounded-xl text-2xl font-black text-slate-900 tabular-nums border-2 border-slate-100">Rs. 0</div>
          </div>

          <div id="payment-already-received-box" class="hidden">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1.5 ml-1">Already Received</label>
            <div id="payment-already-received-display" class="bg-emerald-50 p-2 rounded-xl text-lg font-bold text-emerald-600 tabular-nums border border-emerald-100">Rs. 0</div>
          </div>

          <div>
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1.5 ml-1" id="payment-input-label">Received Amount</label>
            <div class="relative group">
                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-lg font-black text-slate-400 group-focus-within:text-accent">Rs.</span>
                <input type="number" id="payment-input" class="w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3 pl-12 text-2xl font-black text-slate-900 focus:bg-white focus:border-accent focus:ring-4 focus:ring-amber-50 outline-none tabular-nums" placeholder="0" min="0" step="1" oninput="this.value = this.value.replace(/\D/g, '');">
            </div>
          </div>

          <div>
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1.5 ml-1">Payment Method</label>
            <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                <button onclick="app.setPaymentMethod('Cash')" id="pm-cash" class="flex-1 py-1.5 text-[10px] font-black rounded-lg bg-slate-900 text-white shadow-sm">CASH</button>
                <button onclick="app.setPaymentMethod('Online')" id="pm-online" class="flex-1 py-1.5 text-[10px] font-black rounded-lg text-slate-400 hover:text-slate-600">ONLINE</button>
            </div>
          </div>

          <div class="bg-rose-50 border border-rose-100 rounded-xl p-3 flex justify-between items-baseline">
            <span class="text-[10px] font-black text-rose-400 uppercase tracking-widest">Remaining Balance</span>
            <span id="payment-remaining-display" class="text-xl font-black text-rose-600 tabular-nums">Rs. 0</span>
          </div>
        </div>
      </div>

      <div class="p-5 bg-slate-50 border-t border-slate-100 flex gap-3">
        <button onclick="app.hidePaymentModal()" class="flex-1 bg-white border border-slate-200 text-slate-600 py-3 rounded-xl font-black uppercase text-[12px] tracking-widest hover:bg-slate-50">Cancel</button>
        <button id="payment-confirm-btn" class="flex-2 bg-slate-900 text-white px-8 py-3 rounded-xl font-black uppercase text-[12px] tracking-widest hover:bg-slate-800 flex items-center justify-center gap-2 group">
          <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
          <span id="payment-btn-text">Complete Sale</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Quick Calculator Floating Widget -->
  <div id="quick-calculator-widget" onclick="event.stopPropagation()" class="fixed bottom-4 left-52 z-[9999] hidden no-print select-none">
    <div class="bg-slate-900 text-white rounded-2xl shadow-2xl border border-slate-700/80 w-72 overflow-hidden flex flex-col">
      <!-- Calculator Header / Drag Bar -->
      <div class="flex items-center justify-between px-3.5 py-2.5 bg-slate-950/90 border-b border-slate-800 cursor-move" id="calc-header">
        <div class="flex items-center gap-2">
          <div class="w-5 h-5 rounded-md bg-amber-500/20 text-amber-400 flex items-center justify-center">
            <i data-lucide="calculator" class="w-3.5 h-3.5"></i>
          </div>
          <span class="text-xs font-bold tracking-wider text-slate-200">Quick Calculator</span>
        </div>
        <div class="flex items-center gap-1">
          <button type="button" onclick="app.copyCalculatorResult()" class="p-1 text-slate-400 hover:text-amber-400 hover:bg-slate-800 rounded" title="Copy Result">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
          </button>
          <button type="button" onclick="app.closeCalculator()" class="p-1 text-slate-400 hover:text-rose-400 hover:bg-slate-800 rounded" title="Close (Esc)">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

      <!-- Display Screen -->
      <div class="p-3.5 bg-slate-950 flex flex-col items-end justify-center min-h-[76px] border-b border-slate-800 cursor-pointer" onclick="app.copyCalculatorResult()" title="Click to copy result">
        <div id="calc-history" class="text-[11px] font-mono font-medium text-slate-400 tracking-wide truncate max-w-full h-4"></div>
        <div id="calc-display" class="text-2xl font-mono font-bold text-amber-400 tracking-tight truncate max-w-full">0</div>
      </div>

      <!-- Keypad -->
      <div class="p-2.5 grid grid-cols-4 gap-1.5 bg-slate-900 font-bold text-sm">
        <!-- Row 1 -->
        <button onclick="app.calcAction('clear')" class="p-2.5 bg-slate-800/90 hover:bg-rose-500/20 text-rose-400 hover:text-rose-300 rounded-xl active:scale-95 text-xs font-black cursor-pointer">C</button>
        <button onclick="app.calcAction('backspace')" class="p-2.5 bg-slate-800/90 hover:bg-slate-700 text-slate-300 rounded-xl active:scale-95 flex items-center justify-center cursor-pointer" title="Backspace">
          <i data-lucide="delete" class="w-4 h-4"></i>
        </button>
        <button onclick="app.calcAction('percent')" class="p-2.5 bg-slate-800/90 hover:bg-slate-700 text-slate-300 rounded-xl active:scale-95 text-xs font-black cursor-pointer">%</button>
        <button onclick="app.calcAction('op', '/')" class="p-2.5 bg-amber-500/20 hover:bg-amber-500 text-amber-400 hover:text-slate-950 rounded-xl active:scale-95 text-base font-black font-mono cursor-pointer">÷</button>

        <!-- Row 2 -->
        <button onclick="app.calcAction('num', '7')" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl active:scale-95 cursor-pointer">7</button>
        <button onclick="app.calcAction('num', '8')" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl active:scale-95 cursor-pointer">8</button>
        <button onclick="app.calcAction('num', '9')" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl active:scale-95 cursor-pointer">9</button>
        <button onclick="app.calcAction('op', '*')" class="p-2.5 bg-amber-500/20 hover:bg-amber-500 text-amber-400 hover:text-slate-950 rounded-xl active:scale-95 text-base font-black font-mono cursor-pointer">×</button>

        <!-- Row 3 -->
        <button onclick="app.calcAction('num', '4')" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl active:scale-95 cursor-pointer">4</button>
        <button onclick="app.calcAction('num', '5')" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl active:scale-95 cursor-pointer">5</button>
        <button onclick="app.calcAction('num', '6')" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl active:scale-95 cursor-pointer">6</button>
        <button onclick="app.calcAction('op', '-')" class="p-2.5 bg-amber-500/20 hover:bg-amber-500 text-amber-400 hover:text-slate-950 rounded-xl active:scale-95 text-base font-black font-mono cursor-pointer">−</button>

        <!-- Row 4 -->
        <button onclick="app.calcAction('num', '1')" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl active:scale-95 cursor-pointer">1</button>
        <button onclick="app.calcAction('num', '2')" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl active:scale-95 cursor-pointer">2</button>
        <button onclick="app.calcAction('num', '3')" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl active:scale-95 cursor-pointer">3</button>
        <button onclick="app.calcAction('op', '+')" class="p-2.5 bg-amber-500/20 hover:bg-amber-500 text-amber-400 hover:text-slate-950 rounded-xl active:scale-95 text-base font-black font-mono cursor-pointer">+</button>

        <!-- Row 5 -->
        <button onclick="app.calcAction('plusminus')" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl active:scale-95 text-xs font-black cursor-pointer">±</button>
        <button onclick="app.calcAction('num', '0')" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl active:scale-95 cursor-pointer">0</button>
        <button onclick="app.calcAction('dot')" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl active:scale-95 text-sm font-black cursor-pointer">.</button>
        <button onclick="app.calcAction('equals')" class="p-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl active:scale-95 text-base font-black font-mono shadow-md cursor-pointer">=</button>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="fixed inset-0 bg-white/70 hidden items-center justify-center z-[2000] no-print">
    <i data-lucide="loader-2" class="w-10 h-10 text-accent animate-spin"></i>
  </div>

  <!-- Print Preview Modal -->
  <div id="preview-modal" onclick="if(event.target === this) app.closePreview()" class="fixed inset-0 bg-slate-900/80 hidden items-center justify-center z-[900] no-print overflow-hidden">
    <div class="bg-slate-100 w-full max-w-4xl h-[95vh] flex flex-col rounded-2xl shadow-2xl overflow-hidden m-4">
      <!-- Toolbar -->
      <div class="p-4 bg-white border-b flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-amber-100 rounded-xl flex items-center justify-center text-amber-600">
                <i data-lucide="eye" class="w-6 h-6"></i>
            </div>
            <div>
                <h3 id="preview-title" class="font-black text-slate-800 tracking-tight">Receipt Preview</h3>
                <p id="preview-subtitle" class="text-[10px] uppercase font-black text-slate-400 tracking-widest leading-none mt-1">80MM THERMAL RECEIPT PREVIEW</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="app.closePreview()" class="px-6 py-2.5 rounded-xl text-sm font-bold text-slate-500 hover:bg-slate-100">Discard</button>
          <button id="confirm-print-btn" onclick="app.confirmPrint()" class="px-8 py-2.5 rounded-xl text-sm font-black text-white bg-slate-900 hover:shadow-xl hover:shadow-slate-200 flex items-center gap-2 group">
            <i data-lucide="printer" class="w-5 h-5 group-hover:scale-110 transition-transform"></i> Confirm & Print
          </button>
        </div>
      </div>
      <div class="flex-1 overflow-y-auto p-8 flex justify-center items-start bg-slate-200/50 scrollbar-thin scrollbar-thumb-slate-300">
        <div id="preview-paper" class="bg-white shadow-2xl transform origin-top mb-12 w-full max-w-[360px] rounded-lg">
            <!-- Receipt content injected here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Print Containers (Root level for proper pagination and isolation) -->
  <div id="receipt-print" class="hidden print:block bg-white"></div>
  <div id="db-print-container" class="hidden print:block bg-white"></div>
  <div id="voucher-print" class="hidden print:block bg-white"></div>
  <div id="report-print-container" class="hidden print:block bg-white"></div>

  <script src="pages/companies.js"></script>
  <script src="pages/reports.js"></script>
  <script src="pages/settings.js"></script>
  <script src="app.js"></script>
</body>
